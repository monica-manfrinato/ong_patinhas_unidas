<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONG Patinhas Unidas</title>

    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="stylesheet" href="./src/scripts/script.js" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">ONG Patinhas Unidas 🐾</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Cardápio</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h2 class="text-center fw-bold mb-4">Nosso Cardápio</h2>
      <!-- Grid responsivo — Aula 1 -->
      <div
        class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-3"
        id="containerPratos"
      >
        <!-- Cards injetados pelo script.js -->
      </div>

      <section class="container my-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <h2 class="text-center fw-bold mb-4">Faça seu Pedido</h2>

            <form>
              <div class="mb-3">
                <label class="form-label">Seu nome</label>
                <input type="text" class="form-control" id="nomeCliente" />
              </div>
              <div class="mb-3">
                <label class="form-label">Prato favorito</label>
                <select class="form-select" id="selectPrato">
                  <option>Feijoada</option>
                  <option>Moqueca</option>
                </select>
              </div>
              <button type="button" class="btn btn-danger w-100" id="btnConfirmar">
                Confirmar Pedido
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal do Bootstrap (janela popup do pedido) -->
    <div class="modal fade" id="modalPedido" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalTitulo">Confirmar Pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="modalCorpo">
            <!-- O script.js preenche este espaço ao clicar no botão -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btnConfirmarPedidoModal">Finalizar Pedido</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS do Bootstrap para fazer o menu hambúrguer e o Modal funcionarem -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Seu arquivo JavaScript para carregar os cards e lógica do modal -->
    <script src="script.js"></script>
  </body>

</html>
